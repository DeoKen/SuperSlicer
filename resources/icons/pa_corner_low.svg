<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- Pressure advance too low: material piles up at the corners (bulges, blobs), where the nozzle slows down. -->
  <rect x="0" y="0" width="200" height="170" rx="10" fill="#2b2f36"/>
  <g fill="none" stroke="#ed6b21" stroke-width="12" stroke-linejoin="round" stroke-linecap="butt">
    <polyline points="28,58 100,130 172,58"/>
    <polyline points="28,34 100,106 172,34"/>
    <polyline points="28,10 100,82 172,10"/>
  </g>
  <g fill="#ed6b21">
    <ellipse cx="100" cy="134" rx="15" ry="11"/>
    <ellipse cx="100" cy="110" rx="13" ry="9"/>
    <ellipse cx="100" cy="86" rx="13" ry="9"/>
  </g>
</svg>
