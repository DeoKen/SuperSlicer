<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- Pressure advance too high: too little material at the corners: gaps, thin rounded corners, divots after the corner. -->
  <rect x="0" y="0" width="200" height="170" rx="10" fill="#2b2f36"/>
  <g fill="none" stroke="#ed6b21" stroke-width="12" stroke-linecap="butt">
    <line x1="28" y1="58" x2="88" y2="118"/>
    <line x1="112" y1="118" x2="172" y2="58"/>
    <line x1="28" y1="34" x2="88" y2="94"/>
    <line x1="112" y1="94" x2="172" y2="34"/>
    <line x1="28" y1="10" x2="88" y2="70"/>
    <line x1="112" y1="70" x2="172" y2="10"/>
  </g>
  <!-- What is left at the corners: thin, rounded. -->
  <g fill="none" stroke="#ed6b21" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="88,118 100,126 112,118"/>
    <polyline points="88,94 100,102 112,94"/>
    <polyline points="88,70 100,78 112,70"/>
  </g>
</svg>
